# The contracts the chain runs. A workspace of its own: these build for wasm32 only, and their
# hashes are what gets deployed, so this has its own lock file and profile.
[workspace]
resolver = "3"
members = ["sdk", "math", "token", "escrow", "amm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
homepage = "https://qubits.sh"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true
