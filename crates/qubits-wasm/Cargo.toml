[package]
name = "qubits-wasm"
description = "Qubits wallet core for browsers: key files, transaction signing and decoding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
qubits-crypto = { path = "../qubits-crypto", features = ["keystore"] }
qubits-types = { path = "../qubits-types" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# has to match the installed wasm-bindgen CLI exactly
wasm-bindgen = "=0.2.100"

[dev-dependencies]
qubits-execution = { path = "../qubits-execution" }
qubits-state = { path = "../qubits-state", default-features = false }
