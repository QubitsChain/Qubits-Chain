[package]
name = "qubits-types"
description = "Core data types of the Qubits chain: accounts, vaults, transactions, blocks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
qubits-crypto = { path = "../qubits-crypto", features = ["borsh", "serde"] }
bech32 = "0.11"
blake3 = "1.8"
borsh = { version = "1", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
bech32 = "0.11"
